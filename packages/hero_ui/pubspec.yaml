name: hero_ui
description: >-
  A Flutter port of the HeroUI v3 design system: design tokens, themes and
  accessible components for iOS, Android and the web.
version: 0.1.0
repository: https://github.com/Mhamad-Rzgar/flutter-hero-ui
homepage: https://github.com/Mhamad-Rzgar/flutter-hero-ui
issue_tracker: https://github.com/Mhamad-Rzgar/flutter-hero-ui/issues
topics:
  - ui
  - design-system
  - components
  - widgets
  - theme

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
